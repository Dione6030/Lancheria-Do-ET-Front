<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo Circulo -->
  <circle cx="256" cy="256" r="240" fill="#f0f4f8"/>
  
  <!-- Monitor Positivo -->
  <rect x="60" y="120" width="220" height="150" rx="10" fill="#2d3748"/>
  <rect x="72" y="132" width="196" height="110" rx="4" fill="#3182ce"/>
  <text x="170" y="262" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#cbd5e0" text-anchor="middle">positivo</text>
  
  <!-- Base Monitor -->
  <path d="M150 270 L190 270 L200 310 L140 310 Z" fill="#4a5568"/>
  <rect x="120" y="310" width="100" height="10" rx="3" fill="#2d3748"/>

  <!-- Gabinete PC -->
  <rect x="300" y="130" width="90" height="190" rx="6" fill="#1a202c"/>
  <circle cx="345" cy="160" r="7" fill="#48bb78"/>
  <rect x="320" y="190" width="50" height="5" rx="2" fill="#4a5568"/>
  <rect x="320" y="205" width="50" height="5" rx="2" fill="#4a5568"/>

  <!-- Cachorro Quente -->
  <g transform="translate(140, 260) rotate(-8)">
    <!-- Pão Baixo -->
    <path d="M 20 80 C 20 105, 200 105, 200 80 C 200 60, 20 60, 20 80 Z" fill="#d68910"/>
    <!-- Salsicha -->
    <path d="M 10 70 C 10 88, 210 88, 210 70 C 210 52, 10 52, 10 70 Z" fill="#c0392b"/>
    <!-- Mostarda -->
    <path d="M 30 68 Q 55 55, 80 68 T 130 68 T 180 68" stroke="#f1c40f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- Pão Cima -->
    <path d="M 20 65 C 20 40, 200 40, 200 65 C 200 75, 20 75, 20 65 Z" fill="#e59866" opacity="0.85"/>
  </g>
</svg>
